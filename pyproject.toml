[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-cli"
dynamic = ["version"]
description = "Android Emulator AVD CLI — manage emulators, grant root, run ADB commands"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "overtimepog", email = "overtimedev@users.noreply.github.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
keywords = ["android", "emulator", "avd", "adb", "magisk", "root"]

[project.urls]
Homepage = "https://github.com/overtimepog/android-cli"
Repository = "https://github.com/overtimepog/android-cli"
Issues = "https://github.com/overtimepog/android-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
android = "android_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "android_cli.__version__"}
