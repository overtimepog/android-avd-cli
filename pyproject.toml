[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "android-avd-cli"
dynamic = ["version"]
description = "Android Emulator AVD CLI — manage emulators, grant root, run ADB commands"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "overtimepog", email = "overtimedev@users.noreply.github.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
keywords = ["android", "emulator", "avd", "adb", "magisk", "root"]

[project.urls]
Homepage = "https://github.com/overtimepog/android-avd-cli"
Repository = "https://github.com/overtimepog/android-avd-cli"
Documentation = "https://github.com/overtimepog/android-avd-cli#readme"
Issues = "https://github.com/overtimepog/android-avd-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
android = "android_cli.cli:main"

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.hatch.build.targets.wheel]
packages = ["src/android_cli"]

[tool.hatch.version]
path = "src/android_cli/__init__.py"
